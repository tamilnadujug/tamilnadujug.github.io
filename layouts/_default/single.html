{{ define "main" }}
<div class="article-header">
  <div class="container">
    <div class="breadcrumb">
      <a href="{{ "/" | relURL }}">Home</a>
      <span>/</span>
      <span>{{ .Title }}</span>
    </div>
    <h1 class="article-title">{{ .Title }}</h1>
    {{ with .Description }}
    <p class="section-desc">{{ . }}</p>
    {{ end }}
  </div>
</div>

<div class="container" style="margin-bottom: 4rem;">
  <article class="prose">
    {{ .Content }}
  </article>
</div>
{{ end }}
